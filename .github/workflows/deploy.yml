name: Deploy Production to Forpsi FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-ftp-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Deploy to Forpsi Prod via LFTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "$FTP_USER","$FTP_PASS" d115wh.forpsi.com <<'EOF'
          set ftp:ssl-allow no;
          mirror --reverse --verbose ./dist/ ./www/;
          quit
          EOF