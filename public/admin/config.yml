# CMS config — shared by Sveltia/Decap
backend:
  name: github
  repo: stan-jamnicky/detickovo
  branch: main
  # OAuth proxy for owner's GitHub login without a token, see https://github.com/sveltia/sveltia-cms-auth
  # base_url: https://YOUR-WORKER.workers.dev # TODO: deploy worker and uncomment

locale: sk
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: services
    label: Služby
    label_singular: Služba
    folder: src/content/services
    create: true
    fields:
      - { name: title, label: Názov, widget: string }
      - { name: icon, label: Ikona (emoji), widget: string }
      - { name: description, label: Popis, widget: text }
      - { name: order, label: Poradie, widget: number, default: 99 }

  - name: mascots
    label: Maskoti
    label_singular: Maskot
    folder: src/content/mascots
    create: true
    fields:
      - { name: name, label: Meno, widget: string }
      - { name: photo, label: Ilustrácia, widget: image }
      - name: photoPosition
        label: Umiestnenie ilustrácie
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: x, label: "Vodorovne (%)", widget: number, default: 50, value_type: int, min: 0, max: 100 }
          - { name: y, label: "Zvisle (%)", widget: number, default: 50, value_type: int, min: 0, max: 100 }
          - { name: scale, label: Priblíženie, widget: number, default: 1, value_type: float, min: 1, max: 3 }
      - { name: realPhoto, label: Skutočná fotka, widget: image, required: false }
      - name: realPhotoPosition
        label: Umiestnenie skutočnej fotky
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: x, label: "Vodorovne (%)", widget: number, default: 50, value_type: int, min: 0, max: 100 }
          - { name: y, label: "Zvisle (%)", widget: number, default: 50, value_type: int, min: 0, max: 100 }
          - { name: scale, label: Priblíženie, widget: number, default: 1, value_type: float, min: 1, max: 3 }
      - name: category
        label: Kategória
        widget: select
        default: ostatni
        options:
          - { value: labkova-patrola, label: Labková patrola }
          - { value: ladove-kralovstvo, label: Ľadové kráľovstvo }
          - { value: superhrdinovia, label: Superhrdinovia }
          - { value: disney, label: Disney }
          - { value: ostatni, label: A ďalší }
      - { name: order, label: Poradie, widget: number, default: 99 }

  - name: references
    label: Referencie
    label_singular: Referencia
    folder: src/content/references
    create: true
    fields:
      - { name: name, label: Meno / Organizácia, widget: string }
      - { name: quote, label: Citát, widget: text, required: false }
      - { name: logo, label: Logo, widget: image, required: false }
      - { name: order, label: Poradie, widget: number, default: 99 }

  - name: settings
    label: Nastavenia webu
    files:
      - name: site
        label: Kontakt a štatistiky
        file: src/data/site.json
        fields:
          - { name: name, label: Názov, widget: string }
          - { name: maintenance, label: Režim údržby, widget: boolean, default: false, hint: "Zapne stránku „Prepáčte, máme prestávku“ pre návštevníkov." }
          - { name: tagline, label: Slogan, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: phone, label: Telefón (medzinárodný), widget: string }
          - { name: phoneDisplay, label: Telefón (zobrazenie), widget: string }
          - { name: phone2, label: Telefón 2 (medzinárodný), widget: string }
          - { name: phone2Display, label: Telefón 2 (zobrazenie), widget: string }
          - { name: facebook, label: Facebook URL, widget: string }
          - { name: instagram, label: Instagram URL, widget: string }
          - { name: city, label: Pôsobnosť, widget: string }
          - { name: founded, label: Dátum založenia, widget: string, hint: "Formát RRRR-MM-DD, z toho sa počítajú roky skúseností" }
          - name: stats
            label: Štatistiky
            widget: list
            fields:
              - { name: value, label: Hodnota, widget: string, hint: "Hodnota „auto“ = automaticky vypočítané roky od založenia" }
              - { name: label, label: Popis, widget: string }
